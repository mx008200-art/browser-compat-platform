name: macOS WebKit 登录兼容性巡检

on:
  workflow_dispatch:
    inputs:
      target:
        description: '运行正式环境登录巡检'
        required: true
        type: choice
        options:
          - prod
        default: prod
      playwright_version:
        description: '选择要验证的历史 Playwright/WebKit 版本'
        required: true
        type: choice
        options:
          - 1.25.0
          - 1.26.0
          - 1.27.0
          - 1.28.0
          - 1.29.0
          - 1.30.0
          - 1.31.0
          - 1.32.0
          - 1.36.0
          - 1.39.0
          - 1.46.0
          - 1.24.0
          - 1.23.0
          - 1.22.0
        default: 1.24.0

permissions:
  contents: read

jobs:
  safari-webkit-login:
    # 历史 WebKit 二进制优先使用当前仍可用的 Intel macOS runner，避免 ARM 架构兼容性干扰版本验证。
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      TEST_TARGET: ${{ inputs.target }}
      PLAYWRIGHT_VERSION: ${{ inputs.playwright_version }}
      # 避免 WebKit 截图无限等待 document.fonts.ready，导致测试流程无法进入登录点击。
      PW_TEST_SCREENSHOT_NO_FONTS_READY: '1'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 切换历史 Playwright 版本
        run: |
          npm install --no-save --package-lock=false --force @playwright/test@${{ inputs.playwright_version }}
          node -p "require('@playwright/test/package.json').version"
          npx playwright --version

      - name: 安装 Playwright WebKit
        run: npx playwright install webkit

      - name: 运行正式环境巡检
        if: inputs.target == 'prod'
        env:
          LOGIN_PHONE: ${{ secrets.BRM_PROD_PHONE }}
          LOGIN_PASSWORD: ${{ secrets.BRM_PROD_PASSWORD }}
        run: npm test

      - name: 上传 Playwright 录像、截图和诊断结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-webkit-test-results-pw-${{ inputs.playwright_version }}-${{ github.run_number }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: 上传 HTML 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: safari-webkit-playwright-report-pw-${{ inputs.playwright_version }}-${{ github.run_number }}
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7
